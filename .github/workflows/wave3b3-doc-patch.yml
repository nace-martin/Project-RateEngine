name: Wave 3B3 Architecture Doc Patch

on:
  push:
    branches:
      - chore/cleanup-wave-3b3-fx-authority-cutover
    paths:
      - .github/workflows/wave3b3-doc-patch.yml

permissions:
  contents: write

jobs:
  patch-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch exact Section 5.2
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/architecture/clean-database-architecture-v2.1.md')
          text = p.read_text()
          old = '''### 5.2 Currency & Pure Market FX
- Cost is evaluated in `rate_line.currency_code`.
- Quote is denominated in `quote_version.customer_currency`.
- Conversion uses `fx_market_rate` for the applicable quote effective date:
  - **Import CAF Rule:** Deduct 5% from Bank TT BUY rate.
  - **Export CAF Rule:** Add 10% to Bank TT SELL rate.
- If FX rate is missing for the currency pair on the effective date, calculation fails closed.
'''
          new = '''### 5.2 Currency & Pure Market FX
- Cost is evaluated in `rate_line.currency_code`.
- Quote is denominated in `quote_version.customer_currency`.
- `fx_market_rate` is the sole market-FX authority for new calculations; historical `FxSnapshot` records remain quote evidence only.
- Canonical market facts are stored as **FCY/PGK** (`base_currency=FCY`, `quote_currency=PGK`), meaning PGK per 1 FCY.
- Deterministic resolution uses the latest published market fact where `effective_date <= quote_date`; future rates are never selected.
- Inverse resolution swaps bank sides: inverse BUY = `1 / original SELL`; inverse SELL = `1 / original BUY`.
- Cross-currency resolution is deterministic through PGK. Same-currency conversion is identity and needs no FX fact.
- Competing sources for the same latest pair/date fail closed unless an explicit source or approved priority rule resolves the ambiguity.
- Pure market FX and CAF remain separate policy layers:
  - **Import CAF Rule:** Deduct 5% from the applicable Bank TT rate in the Import conversion path.
  - **Export CAF Rule:** Add 10% to Bank TT SELL for Export customer-currency conversion.
- If authoritative FX is required but missing, calculation fails closed. No fabricated FX constants or foreign-currency `1.0` fallback are permitted.
- The existing 24-hour FX age check is an operational warning, not a hard pricing cutoff. A maximum allowed staleness period must not be invented without explicit commercial approval.
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Section 5.2 block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/wave3b3-doc-patch.yml').unlink()
          PY

      - name: Commit architecture amendment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/clean-database-architecture-v2.1.md .github/workflows/wave3b3-doc-patch.yml
          git diff --cached --check
          git commit -m "docs(fx): amend clean architecture for FX authority [wave3b3-patched]"
          git push origin HEAD:${{ github.ref_name }}
