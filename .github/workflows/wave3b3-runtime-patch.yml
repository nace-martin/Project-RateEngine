name: Wave 3B3 Runtime Patch

on:
  push:
    branches:
      - chore/cleanup-wave-3b3-fx-authority-cutover
    paths:
      - .github/workflows/wave3b3-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply asserted FX runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one literal match, found {count}")
              p.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one regex match, found {count}: {pattern}")
              p.write_text(new_text)

          # ------------------------------------------------------------------
          # Export engine: canonical FCY/PGK direct orientation, no defaults.
          # ------------------------------------------------------------------
          export = "backend/pricing_v4/engine/export_engine.py"
          replace_once(
              export,
              "from core.commodity import DEFAULT_COMMODITY_CODE\n",
              "from core.commodity import DEFAULT_COMMODITY_CODE\n"
              "from core.fx_resolution import MissingFxRateError, resolve_market_fx_pair\n",
          )

          sub_once(
              export,
              r"        # FX rates\n        self\.tt_buy = tt_buy or Decimal\('0\.35'\)\n        self\.tt_sell = tt_sell or Decimal\('0\.36'\)\n(?P<policy>        if caf_rate is _POLICY_DEFAULT or margin_rate is _POLICY_DEFAULT:.*?        self\.margin_method = margin_method or 'MARKUP_ON_COST'\n)        \n        # Destination currency used when COLLECT quotes resolve to FCY\n        self\.destination_currency = destination_currency\n        self\.preferred_agent_id = preferred_agent_id\n        self\.preferred_carrier_id = preferred_carrier_id\n        self\.buy_currency = \(buy_currency or \"\"\)\.strip\(\)\.upper\(\) or None\n        \n        # Determine quote currency based on payment term\n        self\.quote_currency = self\._determine_quote_currency\(\)",
              "        # Destination currency determines COLLECT output before FX resolution.\n"
              "        self.destination_currency = destination_currency\n"
              "        self.preferred_agent_id = preferred_agent_id\n"
              "        self.preferred_carrier_id = preferred_carrier_id\n"
              "        self.buy_currency = (buy_currency or \"\").strip().upper() or None\n"
              "        self.quote_currency = self._determine_quote_currency()\n\n"
              "        # FX inputs are optional only when no conversion is required.\n"
              "        self.tt_buy = tt_buy\n"
              "        self.tt_sell = tt_sell\n"
              "        if self.quote_currency != 'PGK' and (self.tt_buy is None or self.tt_sell is None):\n"
              "            pair = resolve_market_fx_pair(self.quote_currency, 'PGK', quote_date)\n"
              "            if self.tt_buy is None:\n"
              "                self.tt_buy = pair.tt_buy_rate\n"
              "            if self.tt_sell is None:\n"
              "                self.tt_sell = pair.tt_sell_rate\n"
              "\\g<policy>",
          )

          sub_once(
              export,
              r"    def _convert_pgk_to_fcy\(self, amount: Decimal\) -> Decimal:\n.*?        return fcy\.quantize\(Decimal\('0\.01'\), rounding=ROUND_HALF_UP\)\n",
              "    def _convert_pgk_to_fcy(self, amount: Decimal) -> Decimal:\n"
              "        if self.caf_rate is None:\n"
              "            raise MissingCommercialPolicyError(\n"
              "                \"Export CAF rate is required for FCY conversion; calculation fails closed.\"\n"
              "            )\n"
              "        if self.tt_sell is None:\n"
              "            raise MissingFxRateError(\n"
              "                f\"TT SELL is required for PGK/{self.quote_currency} conversion.\"\n"
              "            )\n"
              "        effective_rate = self.tt_sell * (Decimal('1') + self.caf_rate)\n"
              "        if effective_rate <= 0:\n"
              "            raise MissingFxRateError(\"Effective Export FX rate must be positive.\")\n"
              "        # Canonical market orientation is FCY/PGK = PGK per one FCY.\n"
              "        fcy = amount / effective_rate\n"
              "        return fcy.quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)\n",
          )

          sub_once(
              export,
              r"    def _get_effective_fx_rate\(self\) -> Decimal:\n.*?        return self\.tt_sell \* \(Decimal\('1'\) \+ self\.caf_rate\)\n",
              "    def _get_effective_fx_rate(self) -> Decimal:\n"
              "        if self.caf_rate is None:\n"
              "            raise MissingCommercialPolicyError(\n"
              "                \"Export CAF rate is required; calculation fails closed.\"\n"
              "            )\n"
              "        if self.tt_sell is None:\n"
              "            raise MissingFxRateError(\n"
              "                f\"TT SELL is required for {self.quote_currency}/PGK conversion.\"\n"
              "            )\n"
              "        return self.tt_sell * (Decimal('1') + self.caf_rate)\n",
          )

          sub_once(
              export,
              r"    def _convert_amount_to_pgk\(self, amount: Decimal, currency: str\) -> Decimal:\n.*?        return pgk\.quantize\(Decimal\('0\.01'\), rounding=ROUND_HALF_UP\)\n",
              "    def _convert_amount_to_pgk(self, amount: Decimal, currency: str) -> Decimal:\n"
              "        currency = str(currency or 'PGK').upper()\n"
              "        if currency == 'PGK':\n"
              "            return amount.quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)\n\n"
              "        if currency == self.quote_currency:\n"
              "            effective_rate = self._get_effective_fx_rate()\n"
              "            pgk = amount * effective_rate\n"
              "        else:\n"
              "            pair = resolve_market_fx_pair(currency, 'PGK', self.quote_date)\n"
              "            pgk = amount * pair.tt_buy_rate\n"
              "        return pgk.quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)\n",
          )

          # ------------------------------------------------------------------
          # Import engine: direct canonical orientation and resolver fallback.
          # ------------------------------------------------------------------
          imp = "backend/pricing_v4/engine/import_engine.py"
          replace_once(
              imp,
              "from core.commodity import DEFAULT_COMMODITY_CODE\n",
              "from core.commodity import DEFAULT_COMMODITY_CODE\n"
              "from core.fx_resolution import MissingFxRateError, resolve_market_fx_pair\n",
          )

          sub_once(
              imp,
              r"        self\.tt_buy = tt_buy or Decimal\('0\.35'\)  # Default TT BUY\n        self\.tt_sell = tt_sell or Decimal\('0\.36'\)  # Default TT SELL\n(?P<policy>        if caf_rate is _POLICY_DEFAULT or margin_rate is _POLICY_DEFAULT:.*?        self\.margin_method = margin_method or 'MARKUP_ON_COST'\n)        self\.fx_rates = fx_rates or \{\}\n        self\._warnings: List\[str\] = \[\]\n        self\._audit_metadata: Dict\[str, List\[dict\[str, str\]\]\] = \{\"fx_fallbacks\": \[\]\}\n        \n        # Determine quote currency \(prefer explicit override, else derive\)\n        self\.quote_currency = quote_currency or self\._determine_quote_currency\(\)",
              "        # Determine quote currency before deciding whether an FX fact is required.\n"
              "        self.quote_currency = quote_currency or self._determine_quote_currency()\n"
              "        self.tt_buy = tt_buy\n"
              "        self.tt_sell = tt_sell\n"
              "        if self.quote_currency != 'PGK' and (self.tt_buy is None or self.tt_sell is None):\n"
              "            pair = resolve_market_fx_pair(self.quote_currency, 'PGK', quote_date)\n"
              "            if self.tt_buy is None:\n"
              "                self.tt_buy = pair.tt_buy_rate\n"
              "            if self.tt_sell is None:\n"
              "                self.tt_sell = pair.tt_sell_rate\n"
              "\\g<policy>"
              "        self.fx_rates = fx_rates or {}\n"
              "        self._warnings: List[str] = []\n"
              "        self._audit_metadata: Dict[str, List[dict[str, str]]] = {}\n",
          )

          sub_once(
              imp,
              r"    def _get_rate_for_currency\(self, currency: str, rate_type: str = 'tt_sell'\) -> Decimal:\n.*?        return Decimal\('1\.0'\)\n\n    def _convert_fcy_to_pgk",
              "    def _get_rate_for_currency(self, currency: str, rate_type: str = 'tt_sell') -> Decimal:\n"
              "        \"\"\"Resolve a canonical FCY/PGK rate; no foreign-currency fallback exists.\"\"\"\n"
              "        currency = str(currency or '').upper()\n"
              "        if currency == 'PGK':\n"
              "            return Decimal('1')\n\n"
              "        if currency == self.quote_currency:\n"
              "            explicit = self.tt_buy if rate_type == 'tt_buy' else self.tt_sell\n"
              "            if explicit is not None:\n"
              "                return explicit\n\n"
              "        info = self.fx_rates.get(currency)\n"
              "        if info and info.get(rate_type) is not None:\n"
              "            return Decimal(str(info[rate_type]))\n\n"
              "        pair = resolve_market_fx_pair(currency, 'PGK', self.quote_date)\n"
              "        return pair.tt_buy_rate if rate_type == 'tt_buy' else pair.tt_sell_rate\n\n"
              "    def _convert_fcy_to_pgk",
          )

          sub_once(
              imp,
              r"    def _convert_fcy_to_pgk\(self, amount: Decimal, currency: Optional\[str\] = None\) -> Decimal:\n.*?        return pgk\.quantize\(Decimal\('0\.01'\), rounding=ROUND_HALF_UP\)\n",
              "    def _convert_fcy_to_pgk(self, amount: Decimal, currency: Optional[str] = None) -> Decimal:\n"
              "        \"\"\"Convert FCY to PGK using canonical TT BUY less Import CAF.\"\"\"\n"
              "        if self.caf_rate is None:\n"
              "            raise MissingCommercialPolicyError(\n"
              "                \"Import CAF rate is required for FCY conversion; calculation fails closed.\"\n"
              "            )\n"
              "        rate = self._get_rate_for_currency(currency, 'tt_buy') if currency else self.tt_buy\n"
              "        if rate is None or rate <= 0:\n"
              "            raise MissingFxRateError(\"A positive TT BUY rate is required for FCY to PGK conversion.\")\n"
              "        effective_rate = rate * (Decimal('1') - self.caf_rate)\n"
              "        if effective_rate <= 0:\n"
              "            raise MissingFxRateError(\"Effective Import TT BUY rate must be positive.\")\n"
              "        pgk = amount * effective_rate\n"
              "        return pgk.quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)\n",
          )

          sub_once(
              imp,
              r"    def _convert_pgk_to_fcy\(self, amount: Decimal, target_currency: Optional\[str\] = None\) -> Decimal:\n.*?        return fcy\.quantize\(Decimal\('0\.01'\), rounding=ROUND_HALF_UP\)\n",
              "    def _convert_pgk_to_fcy(self, amount: Decimal, target_currency: Optional[str] = None) -> Decimal:\n"
              "        \"\"\"Convert PGK to FCY using canonical TT SELL less Import CAF.\"\"\"\n"
              "        if self.caf_rate is None:\n"
              "            raise MissingCommercialPolicyError(\n"
              "                \"Import CAF rate is required for PGK to FCY conversion; calculation fails closed.\"\n"
              "            )\n"
              "        rate = self._get_rate_for_currency(target_currency, 'tt_sell') if target_currency else self.tt_sell\n"
              "        if rate is None or rate <= 0:\n"
              "            raise MissingFxRateError(\"A positive TT SELL rate is required for PGK to FCY conversion.\")\n"
              "        effective_rate = rate * (Decimal('1') - self.caf_rate)\n"
              "        if effective_rate <= 0:\n"
              "            raise MissingFxRateError(\"Effective Import TT SELL rate must be positive.\")\n"
              "        fcy = amount / effective_rate\n"
              "        return fcy.quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)\n",
          )

          replace_once(
              imp,
              "            result.effective_fx_rate = (\n                self.tt_buy * (Decimal('1') - self.caf_rate)\n                if self.caf_rate is not None\n                else None\n            )\n",
              "            result.effective_fx_rate = (\n                self.tt_buy * (Decimal('1') - self.caf_rate)\n                if self.caf_rate is not None and self.tt_buy is not None\n                else None\n            )\n",
          )

          # ------------------------------------------------------------------
          # Adapter: calculations resolve FxMarketRate, snapshot is evidence only.
          # ------------------------------------------------------------------
          adapter = "backend/pricing_v4/adapter.py"
          replace_once(
              adapter,
              "from core.commodity import DEFAULT_COMMODITY_CODE\nfrom core.models import FxSnapshot, Policy\n",
              "from core.commodity import DEFAULT_COMMODITY_CODE\n"
              "from core.fx_resolution import MissingFxRateError, resolve_market_fx_pair\n"
              "from core.models import FxSnapshot, Policy\n",
          )

          replace_once(
              adapter,
              "        self._audit_metadata: dict[str, object] = {}\n",
              "        self._audit_metadata: dict[str, object] = {}\n"
              "        self._resolved_fx_pairs: dict[str, object] = {}\n",
          )

          sub_once(
              adapter,
              r"    def _record_fx_fallback\(self, direction: str, currency: str\) -> None:\n.*?\n    def _capture_fx_audit\(",
              "    def _record_resolved_fx(self, pair) -> None:\n"
              "        key = f\"{pair.base_currency}/{pair.quote_currency}\"\n"
              "        self._resolved_fx_pairs[key] = pair\n"
              "        self._audit_metadata.setdefault(\"fx_market_facts\", {})\n"
              "        facts = self._audit_metadata[\"fx_market_facts\"]\n"
              "        if isinstance(facts, dict):\n"
              "            facts[key] = {\n"
              "                \"effective_date\": pair.effective_date.isoformat(),\n"
              "                \"source\": pair.source,\n"
              "                \"tt_buy\": str(pair.tt_buy_rate),\n"
              "                \"tt_sell\": str(pair.tt_sell_rate),\n"
              "                \"path\": list(pair.path),\n"
              "            }\n\n"
              "    def _capture_fx_audit(",
          )

          # Export standard FX preparation.
          sub_once(
              adapter,
              r"            # Export Engine - now supports payment term and FCY conversion\n            # Get FX rates from snapshot\n            fx_rates = self\._get_fx_rates_dict\(\)\n\n            # Convert payment term string to enum and enforce resolved currency rules:\n(?P<body>.*?)            # Get TT rates for the quote currency\n            fx_info = fx_rates\.get\(quote_currency, \{\}\)\n            tt_buy_from_snapshot = bool\(fx_info and fx_info\.get\('tt_buy'\) is not None\)\n            tt_sell_from_snapshot = bool\(fx_info and fx_info\.get\('tt_sell'\) is not None\)\n            tt_buy = Decimal\(str\(fx_info\.get\('tt_buy'\)\)\) if tt_buy_from_snapshot else Decimal\('2\.50'\)\n            tt_sell = Decimal\(str\(fx_info\.get\('tt_sell'\)\)\) if tt_sell_from_snapshot else Decimal\('2\.78'\)\n",
              "            # Export Engine - market FX resolves from FxMarketRate, never FxSnapshot.\n"
              "            # Convert payment term string to enum and enforce resolved currency rules:\n"
              "\\g<body>"
              "            tt_buy = None\n"
              "            tt_sell = None\n"
              "            if str(quote_currency or '').upper() != 'PGK':\n"
              "                pair = resolve_market_fx_pair(quote_currency, 'PGK', self.quote_input.quote_date)\n"
              "                self._record_resolved_fx(pair)\n"
              "                tt_buy = pair.tt_buy_rate\n"
              "                tt_sell = pair.tt_sell_rate\n",
          )

          replace_once(
              adapter,
              "            fx_applied = (str(quote_currency or '').upper() != 'PGK') and (export_payment_term == ExportPaymentTerm.PREPAID)\n            defaults_used: list[dict[str, str]] = []\n            if not tt_buy_from_snapshot:\n                defaults_used.append({\"field\": \"tt_buy\", \"currency\": str(quote_currency or \"\").upper() or \"UNKNOWN\", \"default\": str(tt_buy)})\n            if not tt_sell_from_snapshot:\n                defaults_used.append({\"field\": \"tt_sell\", \"currency\": str(quote_currency or \"\").upper() or \"UNKNOWN\", \"default\": str(tt_sell)})\n",
              "            fx_applied = str(quote_currency or '').upper() != 'PGK'\n            defaults_used: list[dict[str, str]] = []\n",
          )

          # Import standard FX preparation.
          sub_once(
              adapter,
              r"            # Prepare FX data\n            fx_rates = self\._get_fx_rates_dict\(\)\n            # PRIORITY: Use the currency already determined by the View/User \(Customer Preference\)\n            # If not set, fallback to adapter logic\n            quote_currency = self\.get_output_currency\(\)\n            \n            fx_info = fx_rates\.get\(quote_currency, \{\}\)\n            # Use defaults if missing \(same as Export\)\n            tt_buy_from_snapshot = bool\(fx_info and fx_info\.get\('tt_buy'\) is not None\)\n            tt_sell_from_snapshot = bool\(fx_info and fx_info\.get\('tt_sell'\) is not None\)\n            tt_buy = Decimal\(str\(fx_info\.get\('tt_buy'\)\)\) if tt_buy_from_snapshot else Decimal\('0\.35'\)\n            tt_sell = Decimal\(str\(fx_info\.get\('tt_sell'\)\)\) if tt_sell_from_snapshot else Decimal\('0\.36'\)\n",
              "            # Market FX authority is FxMarketRate.\n"
              "            quote_currency = self.get_output_currency()\n"
              "            normalized_quote_currency = str(quote_currency or 'PGK').upper()\n"
              "            normalized_buy_currency = str(getattr(self.quote_input, 'buy_currency', None) or '').upper() or None\n"
              "            tt_buy = None\n"
              "            tt_sell = None\n"
              "            rate_currency = (\n"
              "                normalized_quote_currency\n"
              "                if normalized_quote_currency != 'PGK'\n"
              "                else normalized_buy_currency\n"
              "            )\n"
              "            if rate_currency and rate_currency != 'PGK':\n"
              "                pair = resolve_market_fx_pair(rate_currency, 'PGK', self.quote_input.quote_date)\n"
              "                self._record_resolved_fx(pair)\n"
              "                tt_buy = pair.tt_buy_rate\n"
              "                tt_sell = pair.tt_sell_rate\n",
          )

          replace_once(
              adapter,
              "            normalized_quote_currency = str(quote_currency or \"\").upper() or \"PGK\"\n            normalized_buy_currency = str(getattr(self.quote_input, \"buy_currency\", None) or \"\").upper() or None\n            fx_applied = (normalized_quote_currency != \"PGK\") or (normalized_buy_currency not in (None, \"\", \"PGK\"))\n            defaults_used = []\n            if not tt_buy_from_snapshot:\n                defaults_used.append({\"field\": \"tt_buy\", \"currency\": normalized_quote_currency, \"default\": str(tt_buy)})\n            if not tt_sell_from_snapshot:\n                defaults_used.append({\"field\": \"tt_sell\", \"currency\": normalized_quote_currency, \"default\": str(tt_sell)})\n",
              "            fx_applied = (normalized_quote_currency != \"PGK\") or (normalized_buy_currency not in (None, \"\", \"PGK\"))\n            defaults_used = []\n",
          )

          replace_once(
              adapter,
              "                fx_rates=fx_rates,\n",
              "                fx_rates={},\n",
          )

          # Snapshot helper remains only for historical/display compatibility.
          sub_once(
              adapter,
              r"    def _get_fx_buy_rate\(self, currency: str, rates: dict\) -> Decimal:\n.*?    def _calculate_chargeable_weight\(self\) -> Decimal:\n",
              "    def _get_fx_buy_rate(self, currency: str, rates: dict | None = None) -> Decimal:\n"
              "        currency = str(currency or 'PGK').upper()\n"
              "        if currency == 'PGK':\n"
              "            return Decimal('1')\n"
              "        pair = resolve_market_fx_pair(currency, 'PGK', self.quote_input.quote_date)\n"
              "        self._record_resolved_fx(pair)\n"
              "        return pair.tt_buy_rate\n\n"
              "    def _get_fx_sell_rate(self, currency: str, rates: dict | None = None) -> Decimal:\n"
              "        currency = str(currency or 'PGK').upper()\n"
              "        if currency == 'PGK':\n"
              "            return Decimal('1')\n"
              "        pair = resolve_market_fx_pair(currency, 'PGK', self.quote_input.quote_date)\n"
              "        self._record_resolved_fx(pair)\n"
              "        return pair.tt_sell_rate\n\n"
              "    def _convert_fcy_to_pgk(self, amount: Decimal, fx_rate: Decimal, caf_pct: Decimal = Decimal('0')) -> Decimal:\n"
              "        if fx_rate is None or fx_rate <= 0:\n"
              "            raise MissingFxRateError(\"A positive TT BUY rate is required for FCY to PGK conversion.\")\n"
              "        rate = fx_rate * (Decimal('1') - caf_pct)\n"
              "        if rate <= 0:\n"
              "            raise MissingFxRateError(\"Effective FX BUY rate must be positive.\")\n"
              "        return amount * rate\n\n"
              "    def _convert_pgk_to_fcy(self, amount: Decimal, fx_rate: Decimal, caf_pct: Decimal = Decimal('0')) -> Decimal:\n"
              "        if fx_rate is None or fx_rate <= 0:\n"
              "            raise MissingFxRateError(\"A positive TT SELL rate is required for PGK to FCY conversion.\")\n"
              "        rate = fx_rate * (Decimal('1') + caf_pct)\n"
              "        if rate <= 0:\n"
              "            raise MissingFxRateError(\"Effective FX SELL rate must be positive.\")\n"
              "        return amount / rate\n\n"
              "    def _calculate_chargeable_weight(self) -> Decimal:\n",
          )

          replace_once(
              adapter,
              "        fx_sell = self._get_fx_sell_rate(curr, fx_rates)\n        if fx_sell <= 0:\n            logger.warning(\"Invalid FX sell rate for discount currency %s; using 1.0\", curr)\n            fx_sell = Decimal('1')\n        return amount * fx_sell\n",
              "        fx_sell = self._get_fx_sell_rate(curr, fx_rates)\n        return amount * fx_sell\n",
          )

          # Remove the temporary workflow from the resulting code commit.
          Path('.github/workflows/wave3b3-runtime-patch.yml').unlink()
          PY

      - name: Commit patched runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/pricing_v4/engine/export_engine.py \
                  backend/pricing_v4/engine/import_engine.py \
                  backend/pricing_v4/adapter.py \
                  .github/workflows/wave3b3-runtime-patch.yml
          git diff --cached --check
          git commit -m "refactor(fx): cut pricing runtime over to FxMarketRate [wave3b3-patched]"
          git push origin HEAD:${{ github.ref_name }}
