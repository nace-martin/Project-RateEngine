name: PR Readiness

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  readiness:
    name: PR Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR evidence contract
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # ratchet:actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Pull request context is required.');
              return;
            }

            const body = pr.body || '';
            const requiredSections = [
              '## Summary',
              '## Root Cause / Rationale',
              '## Scope of Change',
              '## Verification Routing',
              '## Verification',
              '## Intended / Unchanged / Unverified',
              '## Risk',
              '## Rollback',
              '## Definition of Done',
            ];

            const missingSections = requiredSections.filter((section) => !body.includes(section));
            if (missingSections.length) {
              core.setFailed(`Missing required PR sections: ${missingSections.join(', ')}`);
              return;
            }

            const routingOptions = [
              'pricing-change-verification',
              'spot-workflow-verification',
              'quote-regression-check',
              'seed-data-change',
              'structural-audit',
              'No verification skill triggered',
            ];
            const checkedRouting = routingOptions.filter((option) => {
              const escaped = option.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return new RegExp(`- \\[x\\].*${escaped}`, 'i').test(body);
            });
            if (!checkedRouting.length) {
              core.setFailed('Select at least one Verification Routing option in the PR body.');
              return;
            }

            const placeholderPatterns = [
              /Final head SHA:\s*(pending|tbd|todo)/i,
              /Required CI gates on that SHA:\s*(pending|tbd|todo)/i,
              /Command and exact result\s*$/im,
              /Action and observed result, or why manual verification was not possible\s*$/im,
            ];
            const unresolved = placeholderPatterns.filter((pattern) => pattern.test(body));
            if (unresolved.length) {
              core.setFailed('Replace pending/template verification placeholders with concrete evidence before merge.');
              return;
            }

            const dodChecks = [
              'Intended behavior is implemented and proven with concrete evidence.',
              'High-risk adjacent behavior was explicitly verified unchanged.',
              'Applicable commercial/safety invariants were verified at the correct layer.',
              'Required targeted checks and broader CI gates are green on the final head SHA.',
              'No unresolved review findings or unexplained blockers remain.',
              'Scope, residual risk, and rollback are accurately recorded.',
            ];
            const unchecked = dodChecks.filter((label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return !new RegExp(`- \\[x\\] ${escaped}`, 'i').test(body);
            });
            if (unchecked.length) {
              core.setFailed(`Definition of Done is incomplete: ${unchecked.join(' | ')}`);
              return;
            }

            core.info(`PR evidence contract is complete. Routing: ${checkedRouting.join(', ')}`);
