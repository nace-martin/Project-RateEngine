name: PR Readiness

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  readiness:
    name: PR Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR evidence contract
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # ratchet:actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Pull request context is required.');
              return;
            }

            const body = pr.body || '';
            const requiredSections = [
              '## Summary',
              '## Root Cause / Rationale',
              '## Scope of Change',
              '## Verification Routing',
              '## Verification',
              '## Intended / Unchanged / Unverified',
              '## Risk',
              '## Rollback',
              '## Definition of Done',
            ];
            const missingSections = requiredSections.filter((section) => !body.includes(section));
            if (missingSections.length) {
              core.setFailed(`Missing required PR sections: ${missingSections.join(', ')}`);
              return;
            }

            const routingOptions = [
              'pricing-change-verification',
              'spot-workflow-verification',
              'quote-regression-check',
              'seed-data-change',
              'structural-audit',
              'No verification skill triggered',
            ];
            const checkedRouting = routingOptions.filter((option) => {
              const escaped = option.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return new RegExp(`- \\[x\\].*${escaped}`, 'i').test(body);
            });
            if (!checkedRouting.length) {
              core.setFailed('Select at least one Verification Routing option in the PR body.');
              return;
            }

            const finalHeadMatch = body.match(/Final head SHA:\s*`?([0-9a-f]{40})`?/i);
            if (!finalHeadMatch) {
              core.setFailed('Record the 40-character Final head SHA in the PR body.');
              return;
            }
            if (finalHeadMatch[1].toLowerCase() !== pr.head.sha.toLowerCase()) {
              core.setFailed(`Final head SHA in PR body (${finalHeadMatch[1]}) does not match current PR head (${pr.head.sha}).`);
              return;
            }

            const ciMatch = body.match(/Required CI gates on that SHA:\s*(.+)/i);
            if (!ciMatch || !ciMatch[1].trim() || /pending|tbd|todo/i.test(ciMatch[1])) {
              core.setFailed('Record concrete required-CI evidence for the final head SHA.');
              return;
            }

            const templatePlaceholders = [
              'Command/check and exact result',
              'Action and observed result, or why manual verification was not possible',
            ];
            const unresolved = templatePlaceholders.filter((placeholder) => body.includes(placeholder));
            if (unresolved.length) {
              core.setFailed(`Replace verification template placeholders: ${unresolved.join(' | ')}`);
              return;
            }

            const requiredDodFragments = [
              'Intended behavior is proven',
              'High-risk adjacent behavior is protected by evidence',
              'Applicable commercial/safety invariants were checked at the correct layer',
              'Required CI gates are green on the final head SHA',
              'No unresolved review findings or unexplained blockers remain',
              'Scope, residual risk, and rollback are accurately recorded',
            ];
            const unchecked = requiredDodFragments.filter((fragment) => {
              const escaped = fragment.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return !new RegExp(`- \\[x\\].*${escaped}`, 'i').test(body);
            });
            if (unchecked.length) {
              core.setFailed(`Definition of Done is incomplete: ${unchecked.join(' | ')}`);
              return;
            }

            core.info(`PR evidence contract is complete. Routing: ${checkedRouting.join(', ')}`);
