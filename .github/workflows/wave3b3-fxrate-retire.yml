name: Wave 3B3 FxRate Retire

on:
  push:
    branches:
      - chore/cleanup-wave-3b3-fx-authority-cutover
    paths:
      - .github/workflows/wave3b3-fxrate-retire.yml

permissions:
  contents: write

jobs:
  retire-model:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove exact legacy FxRate model block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/core/models.py')
          text = path.read_text()
          start_marker = 'class FxRate(models.Model):\n'
          end_marker = '\n\nclass FxSnapshot(models.Model):\n'
          if text.count(start_marker) != 1:
              raise SystemExit(f'Expected one FxRate model, found {text.count(start_marker)}')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + 'class FxSnapshot(models.Model):\n' + text[end + len(end_marker):]
          path.write_text(text)

          # Remove this one-use patch workflow from the resulting branch.
          Path('.github/workflows/wave3b3-fxrate-retire.yml').unlink()
          PY

      - name: Commit model retirement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/core/models.py .github/workflows/wave3b3-fxrate-retire.yml
          git diff --cached --check
          git commit -m "chore(fx): remove legacy FxRate model [wave3b3-patched]"
          git push origin HEAD:${{ github.ref_name }}
